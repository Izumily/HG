<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>起源电竞俱乐部·三角洲属性检测</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        :root {
            --main-green: #00ffb1;
            --green-glow: rgba(0, 255, 177, 0.55);
            --bg-deep: #070a09;
            --bg-panel: #0d1310;
            --bg-panel-2: #111a16;
            --border-dark: #1a332a;
            --text-main: #e0f5ed;
            --text-sub: #7aa899;
        }
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(0, 255, 177, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 177, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 177, 0.04) 50%, transparent 100%);
            animation: scanLine 8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes scanLine {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .logo-wrap {
            max-width: 640px;
            margin: 0 auto 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .logo-wrap img {
            height: 60px;
            filter: drop-shadow(0 0 8px var(--green-glow));
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: var(--bg-panel);
            border: 1px solid var(--border-dark);
            padding: 32px 28px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 20px rgba(0, 255, 177, 0.1), inset 0 0 30px rgba(0, 255, 177, 0.03);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }
        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--main-green);
        }
        .container::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        .container::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        .page {
            display: none;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .title {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: var(--main-green);
            text-shadow: 0 0 12px var(--green-glow);
            letter-spacing: 2px;
        }
        .desc {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.7;
            letter-spacing: 1px;
        }
        .input-wrap {
            margin-bottom: 24px;
        }
        .input-wrap label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 14px;
            letter-spacing: 1px;
        }
        #playerId {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-panel-2);
            border: 1px solid var(--border-dark);
            color: var(--main-green);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        #playerId:focus {
            border-color: var(--main-green);
            box-shadow: 0 0 12px var(--green-glow);
        }
        .notice-block,
        .bonus-tip {
            background: rgba(0, 255, 177, 0.05);
            padding: 16px;
            border: 1px solid var(--border-dark);
            border-left: 3px solid var(--main-green);
            margin: 20px 0;
        }
        .notice-block p,
        .bonus-tip p {
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.7;
        }
        .notice-block strong,
        .bonus-tip strong {
            color: var(--main-green);
            font-weight: 600;
        }
        .bonus-tip h4 {
            color: var(--main-green);
            margin-bottom: 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .progress-wrap {
            margin-bottom: 24px;
        }
        .progress-text {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-align: right;
        }
        .progress-bar {
            height: 4px;
            background: var(--border-dark);
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--main-green);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--green-glow);
            position: relative;
        }
        .progress-fill::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.4), transparent);
            animation: progressShine 1.5s infinite;
        }
        @keyframes progressShine {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        .question {
            margin-bottom: 26px;
            padding: 16px 14px 20px;
            border-bottom: 1px dashed var(--border-dark);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .question.done {
            background: rgba(0, 255, 177, 0.06);
            box-shadow: 0 0 10px rgba(0, 255, 177, 0.18);
            border: 1px solid rgba(0, 255, 177, 0.35);
        }
        .question:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .q-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.6;
            color: var(--text-main);
        }
        .options label {
            display: block;
            border: 1px solid var(--border-dark);
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-sub);
            font-size: 14px;
            background: rgba(0, 255, 177, 0.02);
            position: relative;
        }
        .options label:hover {
            border-color: var(--main-green);
            color: var(--text-main);
            background: rgba(0, 255, 177, 0.08);
            transform: translateX(4px);
        }
        .options input {
            margin-right: 10px;
            accent-color: var(--main-green);
        }
        .options label:has(input:checked) {
            border-color: var(--main-green);
            color: var(--main-green);
            background: rgba(0, 255, 177, 0.1);
            box-shadow: 0 0 8px var(--green-glow);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 13px;
            border: 1px solid var(--main-green);
            background: transparent;
            color: var(--main-green);
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 2px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 177, 0.2), transparent);
            transition: left 0.5s ease;
        }
        button:hover::before {
            left: 100%;
        }
        button:hover {
            background: rgba(0, 255, 177, 0.15);
            box-shadow: 0 0 15px var(--green-glow);
        }
        .btn-prev {
            border-color: var(--border-dark);
            color: var(--text-sub);
        }
        .btn-prev:hover {
            border-color: var(--main-green);
            color: var(--main-green);
        }
        .btn-start,
        .btn-submit,
        .btn-next {
            background: rgba(0, 255, 177, 0.1);
        }
        .copy-btn {
            margin-top: 12px;
            border-color: var(--border-dark);
            color: var(--text-sub);
        }
        .copy-btn:hover {
            border-color: var(--main-green);
            color: var(--main-green);
        }
        .result-img {
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid var(--border-dark);
            overflow: hidden;
            background: var(--bg-panel-2);
        }
        .result-img img {
            width: 100%;
            display: block;
            filter: saturate(0.8) hue-rotate(10deg);
        }
        .result-id-line {
            font-size: 15px;
            text-align: center;
            margin: 12px 0 8px;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .result-tag {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--main-green);
            margin: 10px 0 8px;
            text-shadow: 0 0 12px var(--green-glow);
            letter-spacing: 3px;
        }
        .result-dim {
            margin: 12px 0 16px;
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            letter-spacing: 1px;
            padding: 8px 0;
            border-top: 1px dashed var(--border-dark);
            border-bottom: 1px dashed var(--border-dark);
            line-height: 1.8;
        }
        .result-dim span {
            color: var(--main-green);
            font-weight: 500;
        }
        .result-text {
            line-height: 1.8;
            color: var(--text-main);
            font-size: 14px;
            text-align: justify;
            margin-top: 16px;
        }
        /* ===== 滑块卡片 ===== */
        .slider-card {
            margin: 16px 0 12px;
            padding: 18px 16px 12px;
            border: 1px solid var(--border-dark);
            background: rgba(0, 255, 177, 0.03);
            border-radius: 4px;
        }
        .slider-card .slider-title {
            font-size: 14px;
            color: var(--main-green);
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-align: center;
            border-bottom: 1px dashed var(--border-dark);
            padding-bottom: 10px;
            text-shadow: 0 0 8px var(--green-glow);
        }
        .slider-item {
            margin-bottom: 18px;
        }
        .slider-item:last-child {
            margin-bottom: 0;
        }
        .slider-item .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .slider-item .slider-label .left {
            color: var(--text-main);
        }
        .slider-item .slider-label .right {
            color: var(--text-main);
        }
        .slider-track {
            position: relative;
            height: 10px;
            background: rgba(0, 255, 177, 0.08);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-dark);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
        }
        .slider-track .fill-left {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 6px 0 0 6px;
            transition: width 0.6s ease;
            box-shadow: 0 0 12px currentColor;
        }
        .slider-track .fill-right {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            border-radius: 0 6px 6px 0;
            transition: width 0.6s ease;
            background: rgba(255,255,255,0.08);
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        .slider-track .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(0, 255, 177, 0.3);
            z-index: 2;
            box-shadow: 0 0 6px var(--green-glow);
        }
        .slider-item .slider-pct {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 3px;
        }
        .slider-item .slider-pct .pct-left {
            color: var(--text-main);
        }
        .slider-item .slider-pct .pct-right {
            color: var(--text-sub);
        }
        /* 四色赛博霓虹 */
        .slider-color-a .fill-left { color: #00f5ff; background: #00f5ff; }
        .slider-color-a .fill-right { background: rgba(0, 245, 255, 0.15); }
        .slider-color-b .fill-left { color: #ff00ff; background: #ff00ff; }
        .slider-color-b .fill-right { background: rgba(255, 0, 255, 0.15); }
        .slider-color-c .fill-left { color: #9d00ff; background: #9d00ff; }
        .slider-color-c .fill-right { background: rgba(157, 0, 255, 0.15); }
        .slider-color-d .fill-left { color: #ffaa00; background: #ffaa00; }
        .slider-color-d .fill-right { background: rgba(255, 170, 0, 0.15); }

        /* ===== 中英释义行 ===== */
        .code-explain-line {
            text-align: center;
            color: var(--main-green);
            white-space: pre-line;
            margin: 8px 0 14px;
            font-size: 16px;
            letter-spacing: 2px;
            line-height: 1.8;
            text-shadow: 0 0 8px rgba(0, 255, 177, 0.55);
        }

        /* ===== 二维码 ===== */
        .qr-wrap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        .qr-item {
            text-align: center;
            border: 1px solid var(--border-dark);
            padding: 12px 6px;
            background: rgba(0, 255, 177, 0.03);
            transition: border-color 0.25s;
        }
        .qr-item:hover {
            border-color: var(--main-green);
        }
        .qr-title {
            font-size: 12px;
            color: var(--main-green);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .qr-item img {
            width: 100%;
            max-width: 100px;
            display: block;
            margin: 0 auto;
            background: #fff;
            border-radius: 4px;
        }
        .kook-bar {
            margin-top: 16px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--main-green);
            background: rgba(0, 255, 177, 0.08);
            color: var(--text-main);
            font-size: 14px;
            letter-spacing: 1px;
        }
        .kook-bar strong {
            color: var(--main-green);
            font-size: 16px;
            margin: 0 4px;
            text-shadow: 0 0 8px var(--green-glow);
        }

        /* ===== 弹窗 ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-mask.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            width: 90%;
            max-width: 420px;
            background: var(--bg-panel);
            border: 1px solid var(--main-green);
            padding: 30px 24px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 25px var(--green-glow);
            position: relative;
            animation: modalPop 0.28s ease-out;
        }
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity:0; }
            100% { transform: scale(1); opacity:1; }
        }
        .modal-box::before,
        .modal-box::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid var(--main-green);
        }
        .modal-box::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        .modal-box::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        .modal-title {
            color: var(--main-green);
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-shadow: 0 0 8px var(--green-glow);
        }
        .modal-text {
            color: var(--text-main);
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .modal-confirm {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 177, 0.1);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.25s;
        }
        .modal-confirm:hover {
            background: rgba(0, 255, 177, 0.18);
            box-shadow: 0 0 12px var(--green-glow);
        }

        /* ===== 自适应 ===== */
        @media (max-width: 520px) {
            .qr-wrap {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 400px) {
            .qr-wrap {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .qr-item {
                padding: 8px 4px;
            }
            .qr-title {
                font-size: 11px;
            }
            .slider-card {
                padding: 12px 10px;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 22px 18px;
            }
            .title {
                font-size: 19px;
            }
            .result-tag {
                font-size: 18px;
            }
            .logo-wrap img {
                height: 48px;
            }
            .modal-box {
                padding: 24px 16px;
            }
            .code-explain-line {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 弹窗 -->
    <div class="modal-mask" id="globalModal">
        <div class="modal-box">
            <h3 class="modal-title">检测提示</h3>
            <p class="modal-text" id="modalMsg"></p>
            <button class="modal-confirm" onclick="closeModal()">确认检查</button>
        </div>
    </div>

    <!-- 顶部LOGO -->
    <div class="logo-wrap">
        <img src="pic/起源电竞logo.png" alt="起源电竞" style="height:250px;">
    </div>

    <div class="container">
        <!-- 开始页 -->
        <div id="startPage" class="page active">
            <h2 class="title">起源电竞俱乐部·三角洲属性检测</h2>
            <p class="desc">20道题测出你的本命单子</p>
            <div class="input-wrap">
                <label>请输入你的干员ID / 昵称</label>
                <input id="playerId" type="text" placeholder="例如：Solo">
            </div>
            <div class="notice-block">
                <p>📋 俱乐部规则：完成本测试的老板下单，享有<strong>额外300W保底</strong>权益；未参与测试下单无保底加成。测试结果仅作娱乐消遣，请勿上升个人及俱乐部本身，祝大家在起源玩的开心。</p>
            </div>
            <button class="btn-start" onclick="startTest()" style="width:100%">开始检测</button>
        </div>

        <!-- 答题页 ×4 -->
        <div id="qPage1" class="page"></div>
        <div id="qPage2" class="page"></div>
        <div id="qPage3" class="page"></div>
        <div id="qPage4" class="page"></div>

        <!-- 结果页 -->
        <div id="resultPage" class="page">
            <div class="result-id-line" id="resIdLine"></div>
            <div class="result-tag" id="resTag"></div>
            <div class="code-explain-line" id="resCodeExplain"></div>
            <div class="result-img" id="resImg"></div>
            <div class="result-dim" id="resDim"></div>
            <div class="slider-card" id="sliderCard">
                <div class="slider-title" id="sliderTitle">干员思维百分比</div>
                <div id="sliderContainer"></div>
            </div>
            <div class="result-text" id="resText"></div>
            <h2 class="title" style="margin-top:20px;">检测报告 · 已完成</h2>
            <div class="bonus-tip">
                <h4>起源俱乐部权益</h4>
                <p>✅ 该干员已完成人格检测，符合保底合约资格，下单可享受额外增加300W保底。</p>
            </div>
            <div class="qr-wrap">
                <div class="qr-item"><div class="qr-title">🤖 客服-鱼鱼</div><img src="qrcode/Fish.jpg" alt="客服-鱼鱼"></div>
                <div class="qr-item"><div class="qr-title">💬 客服-柚柚</div><img src="qrcode/Pomelo.jpg" alt="客服-柚柚"></div>
                <div class="qr-item"><div class="qr-title">🎁 客服-小草莓</div><img src="qrcode/Strawberry.jpg" alt="客服-小草莓"></div>
                <div class="qr-item"><div class="qr-title">📢 公众号</div><img src="qrcode/public.jpg" alt="公众号"></div>
            </div>
            <div class="kook-bar">
                🎧 KOOK频道号：<strong>1119</strong>｜ 加入频道解锁专属福利
            </div>
            <button class="copy-btn" onclick="copyResult()" style="width:100%;">复制结果文案</button>
            <button onclick="resetTest()" style="width:100%;margin-top:12px;">重新检测</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  工具函数
        // ============================================================
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function showModal(msg) {
            document.getElementById("modalMsg").innerText = msg;
            document.getElementById("globalModal").classList.add("show");
        }

        function closeModal() {
            document.getElementById("globalModal").classList.remove("show");
        }

        // ============================================================
        //  题目数据 (20题)

                desc: "三角洲终极贪吃天花板，仓库能买下整个航天城，物资坐标门儿清。为了摸一个大红，命都可以不要。制式套就是全装进图，主打一个人为财死。"
            },
            "A低B低C低D低": {
                code: "V.I.B.E.",
                codeExplain: ["V(isit)", "I(dle)", "B(reak)", "E(asily)"],
                title: "观光客",
                img: "https://picsum.photos/id/1059/600/300",
                desc: "纯来三角洲旅游的观光客，主打一个体验生活。不打架、不摸金、不救队友，哪好看去哪，哪新鲜逛哪。对局输赢无所谓，物资多少不关心，主打一个逛gai式游戏，玩的就是一个休闲放松，属于三角洲里的佛系稀有物种。"
            }
        };

        // ============================================================
        //  中文映射表 (保持原有，新单词可能无映射，但不影响显示)
        // ============================================================
        const wordCnMap = {
            "ia": "嘉", "ao": "豪", "en": "本", "ren": "人",
            "un": "无拘", "ite": "夺取", "ll": "全部", "tack": "进攻",
            "asure": "宝藏", "rike": "打击", "tal": "致命", "ack": "进攻",
            "ield": "收割", "azy": "狂热", "ush": "冲锋", "est": "兴致",
            "outh": "少年", "acrifice": "牺牲", "id": "援助", "ow": "誓言",
            "eliable": "可靠", "isk": "冒险", "vade": "突袭", "torm": "冲击",
            "een": "敏锐", "rawl": "混战", "apid": "迅猛", "nrestrained": "不羁",
            "actics": "战术", "ecure": "稳妥", "ware": "洞察", "leet": "撤离",
            "cape": "脱身", "cho": "回响", "udio": "听觉", "adar": "雷达",
            "ense": "感知", "oney": "财富", "ncome": "收益", "nest": "囤积",
            "tract": "提取", "onceal": "潜伏", "mbush": "伏击", "ask": "伪装",
            "atience": "耐心", "rail": "跟随", "ssist": "辅助", "ain": "获利",
            "lly": "队友", "eal": "治疗", "ndure": "坚守", "oyal": "忠诚",
            "lutton": "贪婪", "ich": "丰厚", "ndless": "无尽", "eposit": "储藏",
            "isit": "到访", "dle": "闲逛", "reak": "脱身", "asily": "随性",
            "razy": "狂热", "ver": "超越", "trike": "打击", "ttack": "突袭",
            "teal": "窃取", "reasure": "宝藏", "nvest": "投资", "torm": "风暴",
            "ominant": "统治", "dept": "娴熟", "harp": "敏锐", "ardcore": "硬核",
            "uardian": "守护", "verwhelming": "压倒", "pex": "顶点", "errifying": "恐惧",
            "unt": "狩猎", "nite": "联合", "teal": "窃取", "reasure": "宝藏",
            "avage": "凶残", "eathal": "致命", "nnihilator": "歼灭", "ielding": "不让",
            "uthless": "冷酷", "nstoppable": "不可挡", "unter": "猎手",
            "agle-eyed": "鹰眼", "oordinator": "协调", "elper": "帮手", "verseer": "俯瞰",
            "wift": "迅捷", "actical": "战术", "oxious": "有毒", "host": "鬼魅",
            "mniscient": "全知", "iding": "等待", "ilent": "无声", "eaper": "收割",
            "crounger": "拾荒", "hancer": "投机", "colyte": "跟班", "ulture": "秃鹫",
            "ealer": "治疗", "mpathetic": "共情", "id": "援助", "ifeline": "生命线",
            "iser": "守财", "nload": "清空", "ooter": "掠夺", "xcessive": "过度", "rawl": "混战",
            "apid": "迅猛", "nrestrained": "不受约束", "actics": "战术", "ao": "豪"
        };

        // ============================================================
        //  状态变量
        // ============================================================
        let playerName = "";
        let currentPageIndex = 0;
        let answers = Array(questions.length).fill(null);

        // ============================================================
        //  核心函数
        // ============================================================

        function startTest() {
            const inputVal = document.getElementById("playerId").value.trim();
            if (!inputVal) { showModal("请输入你的干员ID/昵称"); return; }
            playerName = inputVal;
            goPage(1);
        }

        function goPage(p) {
            window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
            document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
            currentPageIndex = p;
            if (p === 0) {
                document.getElementById("startPage").classList.add("active");
                return;
            } else if (p === 1) {
                renderPage("qPage1", 0);
                document.getElementById("qPage1").classList.add("active");
            } else if (p === 2) {
                renderPage("qPage2", 5);
                document.getElementById("qPage2").classList.add("active");
            } else if (p === 3) {
                renderPage("qPage3", 10);
                document.getElementById("qPage3").classList.add("active");
            } else if (p === 4) {
                renderPage("qPage4", 15);
                document.getElementById("qPage4").classList.add("active");
            }
        }

        function renderPage(pageDomId, startIdx) {
            const dom = document.getElementById(pageDomId);
            dom.innerHTML = "";
            const endIdx = Math.min(startIdx + 5, questions.length);
            const total = questions.length;
            const fragment = document.createDocumentFragment();
            const wrapDiv = document.createElement("div");

            const progressText = document.createElement("div");
            progressText.className = "progress-text";
            progressText.textContent = `题目 ${startIdx+1}-${endIdx} / ${total}`;
            const progressWrap = document.createElement("div");
            progressWrap.className = "progress-wrap";
            const progressBar = document.createElement("div");
            progressBar.className = "progress-bar";
            const progressFill = document.createElement("div");
            progressFill.className = "progress-fill";
            progressFill.style.width = ((endIdx / total) * 100).toFixed(1) + "%";
            progressBar.appendChild(progressFill);
            progressWrap.appendChild(progressText);
            progressWrap.appendChild(progressBar);
            wrapDiv.appendChild(progressWrap);

            for (let i = startIdx; i < endIdx; i++) {
                const q = questions[i];
                const shuffled = shuffleArray(q.options);
                const qDiv = document.createElement("div");
                qDiv.className = "question";
                if (answers[i] !== null) qDiv.classList.add("done");

                const qTitle = document.createElement("div");
                qTitle.className = "q-title";
                qTitle.textContent = `${i+1}. ${q.question}`;
                qDiv.appendChild(qTitle);

                const optWrap = document.createElement("div");
                optWrap.className = "options";
                shuffled.forEach((opt) => {
                    const origIdx = q.options.indexOf(opt);
                    const label = document.createElement("label");
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = `q_${i}`;
                    input.value = origIdx;
                    if (answers[i] === origIdx) input.checked = true;

                    input.onchange = () => {
                        answers[i] = origIdx;
                        qDiv.classList.add("done");
                        autoScrollNext(qDiv, i, endIdx);
                    };

                    label.appendChild(input);
                    label.appendChild(document.createTextNode(opt.text));
                    optWrap.appendChild(label);
                });
                qDiv.appendChild(optWrap);
                wrapDiv.appendChild(qDiv);
            }

            const btnGroup = document.createElement("div");
            btnGroup.className = "btn-group";
            if (startIdx > 0) {
                const btnPrev = document.createElement("button");
                btnPrev.className = "btn-prev";
                btnPrev.textContent = "上一页";
                btnPrev.onclick = () => {
                    if (!checkCurrentPageComplete(startIdx)) {
                        showModal("本页有未完成的题目，请干员仔细检查！");
                        return;
                    }
                    goPage(currentPageIndex - 1);
                };
                btnGroup.appendChild(btnPrev);
            }
            if (endIdx >= questions.length) {
                const btnSubmit = document.createElement("button");
                btnSubmit.className = "btn-submit";
                btnSubmit.textContent = "生成检测报告";
                btnSubmit.onclick = calcResult;
                btnGroup.appendChild(btnSubmit);
            } else {
                const btnNext = document.createElement("button");
                btnNext.className = "btn-next";
                btnNext.textContent = "下一页";
                btnNext.onclick = () => {
                    if (!checkCurrentPageComplete(startIdx)) {
                        showModal("本页有未完成的题目，请干员仔细检查！");
                        return;
                    }
                    goPage(currentPageIndex + 1);
                };
                btnGroup.appendChild(btnNext);
            }
            wrapDiv.appendChild(btnGroup);
            fragment.appendChild(wrapDiv);
            dom.appendChild(fragment);
        }

function autoScrollNext(currentQDiv, idx, endIdx) {
    if (idx + 1 >= endIdx) return;
    const parent = currentQDiv.parentNode;
    const siblings = parent.querySelectorAll(".question");
    let nextEl = null;
    for (let k = 0; k < siblings.length; k++) {
        if (siblings[k] === currentQDiv && k + 1 < siblings.length) {
            nextEl = siblings[k + 1];
            break;
        }
    }
    if (!nextEl) return;
    // 使用 scrollIntoView，block: 'nearest' 只做最小必要滚动
    // 如果下一题已经在视口内，则完全不会滚动
    nextEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function checkCurrentPageComplete(startIdx) {
            const endIdx = Math.min(startIdx + 5, questions.length);
            for (let i = startIdx; i < endIdx; i++) {
                if (answers[i] === null) return false;
            }
            return true;
        }

        // ============================================================
        //  计算结果 & 渲染结果页
        // ============================================================
        function calcResult() {
            const unfinished = answers.some(x => x === null);
            if (unfinished) {
                showModal("存在未完成的题目，请干员返回检查全部题目！");
                return;
            }

            let score = { A: 0, B: 0, C: 0, D: 0 };
            for (let i = 0; i < questions.length; i++) {
                const opt = questions[i].options[answers[i]];
                score.A += opt.score.A;
                score.B += opt.score.B;
                score.C += opt.score.C;
                score.D += opt.score.D;
            }

            // 阈值调整为 >=8 (降低观光客概率)
            const aLevel = score.A >= 7 ? "高" : "低";
            const bLevel = score.B >= 7 ? "高" : "低";
            const cLevel = score.C >= 7 ? "高" : "低";
            const dLevel = score.D >= 7 ? "高" : "低";

            const key = `A${aLevel}B${bLevel}C${cLevel}D${dLevel}`;
            const resItem = resultMap[key] || resultMap["A低B低C低D低"];

            document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
            document.getElementById("resultPage").classList.add("active");

            document.getElementById("resIdLine").innerText = `那么，尊敬的${playerName}干员，您的三角洲成分为：`;
            document.getElementById("resTag").innerText = `${resItem.title} · ${resItem.code}`;

            const engLine = resItem.codeExplain.join(".");
            const cnArr = [];
            resItem.codeExplain.forEach(item => {
                const match = item.match(/\((.+?)\)/);
                if (match) {
                    const word = match[1];
                    cnArr.push(wordCnMap[word] || word);
                } else {
                    cnArr.push(item);
                }
            });
            const cnLine = cnArr.join("·");
            document.getElementById("resCodeExplain").innerHTML = `${engLine}<br>${cnLine}`;

            document.getElementById("resImg").innerHTML = `<img src="${resItem.img}" alt="${resItem.title}">`;

            document.getElementById("resDim").innerHTML =
                `猛攻 <span>${score.A}</span> ｜ 信息 <span>${score.B}</span> ｜ 团队 <span>${score.C}</span> ｜ 贪欲 <span>${score.D}</span>`;

            document.getElementById("sliderTitle").innerText = `${playerName}的干员思维百分比`;
            renderSliders(score);

            document.getElementById("resText").innerHTML = `<p>${resItem.desc}</p>`;

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // ============================================================
        //  百分比滑块
        // ============================================================
        function renderSliders(score) {
            const container = document.getElementById("sliderContainer");
            container.innerHTML = "";

            const dims = [
                { key: "A", label: "猛攻", leftLabel: "激进", rightLabel: "保守", val: score.A, color: "slider-color-a" },
                { key: "B", label: "信息", leftLabel: "搜集", rightLabel: "鲁莽", val: score.B, color: "slider-color-b" },
                { key: "C", label: "团队", leftLabel: "协作", rightLabel: "独狼", val: score.C, color: "slider-color-c" },
                { key: "D", label: "贪欲", leftLabel: "暴食", rightLabel: "节制", val: score.D, color: "slider-color-d" }
            ];

            dims.forEach(d => {
                const pct = Math.round((d.val / 20) * 100);
                const pctRight = 100 - pct;

                const item = document.createElement("div");
                item.className = `slider-item ${d.color}`;

                const labelRow = document.createElement("div");
                labelRow.className = "slider-label";
                labelRow.innerHTML =
                    `<span class="left">${d.leftLabel}</span><span>${d.label}</span><span class="right">${d.rightLabel}</span>`;
                item.appendChild(labelRow);

                const track = document.createElement("div");
                track.className = "slider-track";

                const fillLeft = document.createElement("div");
                fillLeft.className = "fill-left";
                fillLeft.style.width = pct + "%";

                const fillRight = document.createElement("div");
                fillRight.className = "fill-right";
                fillRight.style.width = pctRight + "%";

                const center = document.createElement("div");
                center.className = "center-line";

                track.appendChild(fillLeft);
                track.appendChild(fillRight);
                track.appendChild(center);
                item.appendChild(track);

                const pctRow = document.createElement("div");
                pctRow.className = "slider-pct";
                pctRow.innerHTML =
                    `<span class="pct-left">${pct}%</span><span class="pct-right">${pctRight}%</span>`;
                item.appendChild(pctRow);

                container.appendChild(item);
            });
        }

        // ============================================================
        //  复制结果
        // ============================================================
        function copyResult() {
            const tag = document.getElementById("resTag").innerText;
            const desc = document.getElementById("resText").innerText;
            const dimText = document.getElementById("resDim").innerText.replace(/<[^>]*>/g, '');
            const pctItems = document.querySelectorAll("#sliderContainer .slider-item");
            let pctStr = "";
            pctItems.forEach(item => {
                const label = item.querySelector(".slider-label span:nth-child(2)")?.innerText || "";
                const pcts = item.querySelectorAll(".slider-pct span");
                const leftPct = pcts[0]?.innerText || "0%";
                const rightPct = pcts[1]?.innerText || "0%";
                pctStr += `${label} ${leftPct} / ${rightPct}  `;
            });

            const text =
                `【三角洲玩家人格检测】\n干员：${playerName}\n结果：${tag}\n${dimText}\n${pctStr.trim()}\n${desc}\n完成测试下单享300W保底\nKOOK频道：1119`;

            navigator.clipboard.writeText(text).then(() => {
                showModal("结果已复制，请干员发给客服吧！");
            }).catch(() => {
                showModal("复制失败，请手动长按复制");
            });
        }

        // ============================================================
        //  重置
        // ============================================================
        function resetTest() {
            answers = Array(questions.length).fill(null);
            playerName = "";
            document.getElementById("playerId").value = "";
            currentPageIndex = 0;
            goPage(0);
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener("DOMContentLoaded", function() {
            goPage(0);
        });
    </script>
